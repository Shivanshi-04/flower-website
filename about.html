<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">

<body>

    <!-- Navbar -->
  <nav class="nav-container position-fixed w-100">
    <div class="container">
      <div class="row align-items-center border-bottom border-dark py-2">
 
        <div class="col-6 col-lg-6 py-3">
          <a href="index.html">
            <img src="images/logo.svg" alt="Logo" class="img-fluid">
          </a>
        </div>
 
        <div class="col-6 col-lg-6">
          <ul class="d-flex justify-content-end gap-2 gap-md-4 list-unstyled mb-0">
            <li><a href="gallery.html" class="fw-bold text-decoration-none text-dark small-text">GALLERY</a></li>
            <li><a href="about.html" class="fw-bold text-decoration-none text-dark small-text">ABOUT</a></li>
            <li><a href="contact.html" class="fw-bold text-decoration-none text-dark small-text">CONTACT</a></li>
          </ul>
        </div>
 
      </div>
    </div>
  </nav>

  <!-- header -->
   <header class="container-fluid  py-lg-4">
      <div class="container">
        <div class="row header-container">
          <h1 class="gallery-heading text-uppercase fw-bold ">Gallery</h1>
        </div>
      </div>
   </header>

  <!-- main section -->
   <section class="container-fluid about-section">
     <div class="container">

      <!-- heading Row -->
        <div class="row">
          <div class="col-12">
            <h2 class="fw-bold about-main-heading py-5">Our Blooms was founded in honor of Lily Smith’s loving aunts, Teresa and Beth.</h2>
          </div>
        </div>
        
        <!-- image card row -->
         <!-- flower 1 -->
        <div class="row flower-grid g-0">
          <div class="col-md-4 col-12 px-2 mb-3 mb-md-0">

              <img src="images/flower1.png" alt="Pink peonies in a vase">
            </div>
          </div>

          <!-- flower2 -->
          <div class="col-md-4 col-12 px-2 mb-3 mb-md-0">
            <div class="flower-img">
              <img src="images/flower2.png" alt="Dark pink peony flower">
            </div>
          </div>

          <!-- flower 3 -->
          <div class="col-md-4 col-12 px-2 mb-3 mb-md-0">
            <div class="flower-img">
              <img src="images/flower3.png" alt="White tulip close up">
            </div>
          </div>
          
        </div>
     </div>
   </section>



    <!-- footer -->
  <footer class="container-fluid">
    <div class="container text-center footer-img">
      <img src="images/flower12.png" alt="flower">
    </div>
  </footer>
